<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAINBOW SLOT VIP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার প্যানেল -->
    <div class="header">
        <div class="brand">
            <div class="name">RAINBOW SLOT</div>
            <div class="game">3-REEL MEGA JACKPOT</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🎰 ওরিজিনাল ৩-রিল ডিভ এবং সিএসএস অ্যানিমেশন স্লট মেশিন জোন ভাই ভাই -->
    <div class="slot-machine-zone">
        <div class="slot-window-frame">
            <div class="reel-container">
                <div class="reel" id="reel-0"></div>
                <div class="reel" id="reel-1"></div>
                <div class="reel" id="reel-2"></div>
            </div>
            <!-- মাঝখানের সুদৃশ্য গোল্ডেন উইন টার্গেট লাইন -->
            <div class="win-target-line"></div>
        </div>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ স্কোরিং মেসেজ বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">SPIN বোতাম চেপে লাকি রেনবো রিল ঘুরান ভাই ভাই!</span>
    </div>

    <!-- 🎛️ কন্ট্রোল প্যানেল এরিয়া (৳১-৳২০০০ প্লাস-মাইনাস ও SPIN বোতাম পাশাপাশি লক ভাই) -->
    <div class="footer-controls">
        <div class="play-section">
            <div class="bet-selector">
                <button class="bet-btn-nav" onclick="adjustBet('minus')">−</button>
                <div style="text-align: center; width: 60px;">
                    <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                    <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
                </div>
                <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>
            </div>

            <button class="play-btn" id="spin-btn" onclick="handleSlotSpin()">SPIN</button>

            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🔄</button>
            </div>
        </div>
    </div>

    <!-- 🔌 [উইনগো কালার ট্রেড সিঙ্ক - ইউনিভার্সাল সকেট ইঞ্জিন লাইব্রেরি ভাই] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        
        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50; 
        let isSpinning = false; 
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        // 🚀 আপনার ওরিজিনাল স্ক্রিনশটের ১৬৩ নম্বর লাইন অনুযায়ী ডেডিকেটেড কমপ্লিট স্পিন লুপ ভাই ভাই!
        async function handleSlotSpin() {
            if (isSpinning) return;

            try {
                slotSounds.click.play();
                slotSounds.spin.play();
            } catch (e) { console.log("Autoplay waiting for click"); }

            document.getElementById("win-status-box").className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🎰 রেনবো রিল শোঁ শোঁ করে ঘুরছে...";

            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;

            // 🚀 হুবহু স্ক্রিনশটের ১৭৫-১৭৮ লাইনের ওরিজিনাল সিএসএস স্ক্রলিং অ্যানিমেশন অন ফায়ার ভাই ভাই!
            const reelsElements = document.querySelectorAll(".reel");
            reelsElements.forEach(r => {
                r.classList.remove("win-highlight", "dim-effect");
                r.classList.add(isAuto ? "turbo-mode" : "scrolling");
            });

            try {
                // ডাইস-৩ডি এর মতো সরাসরি ডাইনামিক SERVER_URL লোকাল রাউটিং গেটওয়ে হিট লক ভাই ভাই!
                const response = await fetch(`${SERVER_URL}/api/rainbow-spin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: parseFloat(currentBet),
                        wallet: urlWallet
                    })
                });

                const data = await response.json();

                if (data && data.success === true) {
                    balance = parseFloat(data.balance);
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");

                    // রেন্ডার থেকে রেসপন্স আসার পর ১.২ সেকেন্ড স্ক্রলিং থ্রিল দিয়ে স্টপ ফাংশন কল ভাই ভাই
                    setTimeout(() => {
                        const matrixData = [data.reel1, data.reel2, data.reel3];
                        stopReels(matrixData, data.winAmount, data.status);
                    }, isAuto ? 400 : 1200);

                } else {
                    reelsElements.forEach(r => {
                        r.classList.remove("scrolling", "turbo-mode");
                    });
                    alert(data.message || "❌ Insufficient Balance! Please Recharge.");
                    stopSlotState();
                }
            } catch (err) {
                reelsElements.forEach(r => {
                    r.classList.remove("scrolling", "turbo-mode");
                });
                alert("⚠️ সেশন আউট! আবার SPIN বোতাম চাপুন ভাই ভাই।");
                stopSlotState();
            }
        }

        // 🚀 আপনার স্ক্রিনশটের ২৩০ নম্বর লাইনের হুবহু ১০০০০০% একুরেট ওরিজিনাল ইমেজ লোডার বর্ম ভাই ভাই!
        function stopReels(matrix, winAmount, status) {
            const reelsElements = document.querySelectorAll(".reel");
            
            for (let i = 0; i < 3; i++) {
                reelsElements[i].classList.remove("scrolling", "turbo-mode");
                const symbolImg = matrix[i];
                // 🚀 হুবহু স্ক্রিনশটের ২৩৭ নম্বর লাইনের ওরিজিনাল ইমেজ পাথ ফোল্ডার লিঙ্ক প্লাগইন লক ভাই ভাই!
                reelsElements[i].innerHTML = `<img src="./${symbolImg}.png" alt="${symbolImg}" class="symbolImg">`;
            }

            showFinalReward(status, winAmount, matrix[0]);
        }

        function showFinalReward(status, winAmount, combination) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");

            if (status === "win") {
                try { slotSounds.win.play(); } catch(e){}
                msgBox.className = "win-status-container win-glow-bar";
                // আপনার ডায়েরির বানান অনুযায়ী কম্বিনেশন নামের ক্যাচ ম্যাপ ভাই ভাই
                textMsg.innerText = `🏆 মেগা উইন!! কম্বিনেশন মিলেছে: [${combination}] = ৳${winAmount}`;
            } else {
                try { slotSounds.wheel.play(); } catch(e){}
                msgBox.className = "win-status-container lose-glow-bar";
                textMsg.innerText = "❌ ওহ! এই রাউন্ডে রিল মেলেনি। আবার ট্রাই করুন ভাই ভাই!";
            }

            document.getElementById("user-balance").innerText = balance.toFixed(2);
            stopSlotState();

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleSlotSpin();
                }, 2500);
            }
        }

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    fetchLiveBalance();
                }
            });
        }

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/rainbow-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const data = await response.json();
                if (data && data.success) {
                    balance = parseFloat(data.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            } catch (e) { console.error("Balance Fetch Lag"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
            
            // ওরিজিনাল ডিফল্ট স্টার্ট আপ ইমেজ ভিউ লক ভাই ভাই
            const reelsElements = document.querySelectorAll(".reel");
            const startSymbols = ["CHERRY", "LEMON", "WATERMELON"];
            for (let i = 0; i < 3; i++) {
                reelsElements[i].innerHTML = `<img src="./${startSymbols[i]}.png" alt="slot" class="symbolImg">`;
            }
        };

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 1) {
                if (currentBet <= 10) currentBet -= 1;
                else if (currentBet <= 100) currentBet -= 10;
                else currentBet -= 50;
            }
            if (action === 'plus' && currentBet < 2000) {
                if (currentBet < 10) currentBet += 1;
                else if (currentBet < 100) currentBet += 10;
                else currentBet += 50;
            }
            if (currentBet < 1) currentBet = 1;
            if (currentBet > 2000) currentBet = 2000;
            
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            try { slotSounds.click.play(); } catch(e){}
        }

               function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("mute-btn").innerText = isMuted ? "🔇" : "🔊";
            document.getElementById("mute-btn").classList.toggle("muted-active", isMuted);
            slotSounds.click.muted = isMuted;
            slotSounds.spin.muted = isMuted;
            slotSounds.win.muted = isMuted;
            slotSounds.wheel.muted = isMuted;
        }

        function toggleAuto() {
            isAuto = !isAuto;
            document.getElementById("auto-btn").classList.toggle("active", isAuto);
            if (isAuto && !isSpinning) handleSlotSpin();
            try { slotSounds.click.play(); } catch(e){}
        }

        function stopSlotState() {
            isSpinning = false;
            document.getElementById("spin-btn").disabled = false;
            if (!isAuto && autoInterval) clearTimeout(autoInterval);
        }

        // 🎯 [৪টি ওরিজিনাল প্রিমিয়াম ক্যাসিনো সাউন্ড ও বাফার গেটওয়ে লক ভাই ভাই]
        const slotSounds = {
            click: new Audio('click2.mp3'),
            spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3'),
            wheel: new Audio('wheel1.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());
    </script>
</body>
</html>

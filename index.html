<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAINBOW MEGAWAYS SLOT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #060913; color: white; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; height: 100dvh; overflow: hidden; padding-bottom: env(safe-area-inset-bottom); }
        .header { width: 100%; padding: 6px 16px; display: flex; justify-content: space-between; align-items: center; background: #0e1322; border-bottom: 2px solid #f1c40f; flex-shrink: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        .brand .name { color: #f1c40f; font-weight: 900; font-size: 17px; letter-spacing: 1px; }
        .brand .game { color: #00ffcc; font-weight: bold; font-size: 10px; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .sound-btn { background: #1a2238; border: 1px solid #1a233d; color: #fff; font-size: 14px; width: 32px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .sound-btn.muted-active { background: #7f1d1d; border-color: #ea2027; }
        .balance-box { background: linear-gradient(145deg, #10ac84, #1dd1a1); padding: 4px 12px; border-radius: 30px; font-weight: bold; font-size: 14px; border: 1px solid #ffffff33; }
        
        /* 🎰 ৩x৩ গ্রিড লাক্সারি আল্ট্রা উইন্ডো ফ্রেম ভাই ভাই */
        .slot-machine-zone { display: flex; justify-content: center; align-items: center; width: 100%; max-width: 380px; height: 48%; margin: auto 0; padding: 2px 5px; flex-shrink: 1; }
        .slot-window-frame { width: 100%; height: 100%; background: #111827; border-radius: 20px; padding: 10px; border: 4px solid #f1c40f; box-shadow: 0 0 20px rgba(241, 196, 15, 0.3), inset 0 0 15px #000; position: relative; }
        .grid-container { display: flex; width: 100%; height: 100%; gap: 8px; }
        .reel-column { flex: 1; height: 100%; display: flex; flex-direction: column; gap: 8px; }
        .slot-cell { flex: 1; background: #0f1524; border-radius: 12px; border: 2px solid #1a233d; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        
        /* 🔄 সিএসএস মোশন স্ক্রলিং ব্লার অ্যানিমেশন ভাই ভাই */
        .scrolling { animation: slotBlurScroll 0.2s infinite linear; }
        .turbo-mode { animation: slotBlurScroll 0.08s infinite linear; }
        @keyframes slotBlurScroll { 0% { transform: translateY(-8px); filter: blur(2px); } 100% { transform: translateY(8px); filter: blur(3px); } }
        
        .symbolImg { width: 68px !important; height: 68px !important; object-fit: contain !important; display: block !important; animation: imgPopIn 0.25s ease-out; }
        @keyframes imgPopIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        /* 🚀 উইন হাইলাইট গোল্ডেন গ্লো বর্ডার চাবি ভাই ভাই */
        .win-highlight { border-color: #f1c40f !important; box-shadow: 0 0 15px #f1c40f !important; background: #1e1b4b !important; z-index: 5; }
        
        .win-status-container { width: 92%; max-width: 360px; background: #0e1322; border: 1px solid #1a233d; padding: 8px; border-radius: 12px; text-align: center; font-weight: bold; font-size: 12px; color: #00e6ff; flex-shrink: 0; margin-bottom: 8px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .win-glow-bar { background: #10ac84 !important; color: #fff !important; box-shadow: 0 0 15px #10ac84 !important; border-color: #fff; }
        .lose-glow-bar { background: #962d2d !important; color: #fff !important; box-shadow: 0 0 15px #962d2d !important; border-color: #fff; }
        
        .footer-controls { position: relative; bottom: 0; margin-bottom: 45px; width: 94%; max-width: 360px; background: #0e1322; padding: 8px 10px; border-radius: 25px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 1px solid #1a233d; box-shadow: 0 -5px 25px rgba(0,0,0,0.7); pointer-events: auto; flex-shrink: 0; }
        .play-section { display: flex; align-items: center; gap: 12px; width: 100%; justify-content: space-between; padding: 0 4px; box-sizing: border-box; }
        .bet-selector { display: flex; align-items: center; background: #060913; padding: 4px 12px; border-radius: 20px; border: 2px solid #1a233d; flex: 1; justify-content: space-between; }
        .bet-btn-nav { color: #f1c40f; border: none; background: none; font-size: 18px; font-weight: bold; cursor: pointer; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; }
        .play-btn { background: linear-gradient(180deg, #f1c40f, #f39c12); color: #000; padding: 8px 22px; border-radius: 20px; font-weight: 900; font-size: 14px; cursor: pointer; border: none; box-shadow: 0 3px 10px rgba(241,196,15,0.3); transition: 0.1s; letter-spacing: 1px; }
        .play-btn:disabled { background: #555 !important; color: #aaa !important; box-shadow: none !important; cursor: not-allowed; }
        .icon-group { display: flex; gap: 8px; }
        .icon-btn { background: #1a2238; border: none; color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .icon-btn.active { background: #7f1d1d; color: #f1c40f; box-shadow: 0 0 8px #f1c40f; }
    </style>
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার প্যানেল (অতিরিক্ত ব্যালেন্স বক্স চিরতরে গায়েব ভাই ভাই) -->
    <div class="header">
        <div class="brand">
            <div class="name">RAINBOW MEGAWAYS</div>
            <div class="game">3x3 ALL-WAYS JACKPOT</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
        </div>
    </div>

    <div class="slot-machine-zone">
        <div class="slot-window-frame">
            <div class="grid-container">
                <!-- ৩টি কলাম ও ৯টি ঘরের সেল ম্যাট্রিক্স ভাই ভাই -->
                <div class="reel-column" id="col-0">
                    <div class="slot-cell" id="cell-0-0"></div>
                    <div class="slot-cell" id="cell-1-0"></div>
                    <div class="slot-cell" id="cell-2-0"></div>
                </div>
                <div class="reel-column" id="col-1">
                    <div class="slot-cell" id="cell-0-1"></div>
                    <div class="slot-cell" id="cell-1-1"></div>
                    <div class="slot-cell" id="cell-2-1"></div>
                </div>
                <div class="reel-column" id="col-2">
                    <div class="slot-cell" id="cell-0-2"></div>
                    <div class="slot-cell" id="cell-1-2"></div>
                    <div class="slot-cell" id="cell-2-2"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">সারি, কোনাকুনি অথবা যেকোনো জায়গায় ৩টি মিললে উইন ভাই ভাই!</span>
    </div>

    <div class="footer-controls">
        <div class="play-section">
            <div class="bet-selector">
                <button class="bet-btn-nav" onclick="adjustBet('minus')">−</button>
                <div style="text-align: center; width: 60px;">
                    <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                    <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
                </div>
                <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>
            </div>

            <button class="play-btn" id="spin-btn" onclick="handleMegaSlotSpin()">SPIN</button>

            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🔄</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50; 
        let isSpinning = false; 
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        async function handleMegaSlotSpin() {
            if (isSpinning) return;

            try { slotSounds.click.play(); slotSounds.spin.play(); } catch (e) {}

            document.getElementById("win-status-box").className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🎰 ৯টি ঘর একসাথে স্পিন হচ্ছে...";

            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;

            // ৯টি ঘরকে একসাথে মেগা মোশন লুপ বর্ম ফায়ার ভাই ভাই
            const cells = document.querySelectorAll(".slot-cell");
            cells.forEach(c => {
                c.classList.remove("win-highlight");
                c.classList.add(isAuto ? "turbo-mode" : "scrolling");
            });

            try {
                const response = await fetch(`${SERVER_URL}/api/rainbow-spin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: urlUserId, amount: parseFloat(currentBet), wallet: urlWallet })
                });

                                const data = await response.json();

                if (data && data.success === true) {
                    balance = parseFloat(data.balance);
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");

                    // 🎯 [মেগা ৩×৩ ম্যাট্রিক্স সিঙ্ক]: সার্ভার থেকে আসা ৯টি ঘরকে ১.২ সেকেন্ড স্পিন থ্রিল দিয়ে ফ্রেমে সেট ভাই ভাই!
                    setTimeout(() => {
                        stopAllReelsWithMatrix(data.matrix, data.winAmount, data.status, data.winningLines);
                    }, isAuto ? 400 : 1200);

                } else {
                    const cells = document.querySelectorAll(".slot-cell");
                    cells.forEach(c => c.classList.remove("scrolling", "turbo-mode"));
                    alert(data.message || "❌ Insufficient Balance! Please Recharge.");
                    stopSlotState();
                }
            } catch (err) {
                const cells = document.querySelectorAll(".slot-cell");
                cells.forEach(c => c.classList.remove("scrolling", "turbo-mode"));
                alert("⚠️ সেশন আউট! আবার SPIN বোতাম চাপুন ভাই ভাই।");
                stopSlotState();
            }
        }

        // 🚀 ৯টি নিয়ন ঘরে ৩×৩ আকারে ওরিজিনাল ইমেজ ইনজেকশন এবং উইন হাইলাইট বর্ম ভাই ভাই!
        function stopAllReelsWithMatrix(matrix, winAmount, status, winningLines) {
            // matrix = [ [R0C0, R0C1, R0C2], [R1C0, R1C1, R1C2], [R2C0, R2C1, R2C2] ]
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const cell = document.getElementById(`cell-${row}-${col}`);
                    cell.classList.remove("scrolling", "turbo-mode", "win-highlight", "dim-effect");
                    
                    const symbolImg = matrix[row][col];
                    // হুবহু আপনার আপলোড করা চেরি, বার ও তরমুজের ওরিজিনাল পিএনজি ছবি ইনজেক্ট লক ভাই ভাই!
                    cell.innerHTML = `<img src="./${symbolImg}.png" alt="${symbolImg}" class="symbolImg">`;
                }
            }

            // 🎯 উইনিং পেলাইন এবং এনিহোয়ার ৩-ম্যাচ ঘরগুলোকে নিয়ন গ্লো দিয়ে হাইলাইট করার জাদুকরী ট্রিকস ভাই ভাই!
            if (status === "win" && winningLines && winningLines.length > 0) {
                const cells = document.querySelectorAll(".slot-cell");
                cells.forEach(c => c.classList.add("dim-effect")); // বাকি ঘরগুলো আবছা হবে

                winningLines.forEach(lineId => {
                    // ৫টি ওরিজিনাল স্ট্যান্ডার্ড পেলাইন কোঅর্ডিনেট ম্যাপিং
                    let coordinates = [];
                    if (lineId === "LINE_1") coordinates = [[0,0], [0,1], [0,2]]; // ওপরের সারি
                    if (lineId === "LINE_2") coordinates = [[1,0], [1,1], [1,2]]; // মাঝের সারি
                    if (lineId === "LINE_3") coordinates = [[2,0], [2,1], [2,2]]; // নিচের সারি
                    if (lineId === "LINE_4") coordinates = [[0,0], [1,1], [2,2]]; // কোনাকুনি বাম-টু-ডান
                    if (lineId === "LINE_5") coordinates = [[0,2], [1,1], [2,0]]; // কোনাকুনি ডান-টু-বাম
                    
                    // যদি এনিহোয়ার ৩-ম্যাচ স্ক্যাটার উইন হয়, তবে সার্ভার থেকে সরাসরি ঘরের কোঅর্ডিনেট আসবে
                    if (Array.isArray(lineId)) coordinates = lineId; 

                    coordinates.forEach(pos => {
                        const cell = document.getElementById(`cell-${pos[0]}-${pos[1]}`);
                        if (cell) {
                            cell.classList.remove("dim-effect");
                            cell.classList.add("win-highlight"); // বিজয়ী ঘরগুলো নিয়ন গ্লো জ্বলবে!
                        }
                    });
                });
            }

            showFinalReward(status, winAmount);
        }

               // 🚀 [বাটন লক হওয়া এবং স্টেট রিসেট জ্যাম ১০০০০০% চিরতরে আনলক বর্ম ভাই ভাই]
        function showFinalReward(status, winAmount) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");

            if (status === "win") {
                try { slotSounds.win.play(); } catch(e){}
                msgBox.className = "win-status-container win-glow-bar";
                textMsg.innerText = `🏆 মেগা উইন!! মাল্টি-পেলাইন মিলে সরাসরি: ৳${winAmount} প্লাস`;
            } else {
                try { slotSounds.wheel.play(); } catch(e){}
                msgBox.className = "win-status-container lose-glow-bar";
                textMsg.innerText = "❌ ওহ! এই রাউন্ডে কোনো পেলাইন মেলেনি। আবার ট্রাই করুন ভাই ভাই!";
            }

            document.getElementById("user-balance").innerText = balance.toFixed(2);
            
            // 🚀 [চূড়ান্ত ফিক্স]: ওল্ড নামের জ্যাম কেটে হুবহু স্টপ স্লট স্টেট দেওয়ায় বাটন এখন ১ মিলি-সেকেন্ডে আনলক ভাই ভাই!
            stopSlotState();

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleSlotSpin();
                }, 2500);
            }
        }
 

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    fetchLiveBalance();
                }
            });
        }

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/rainbow-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const data = await response.json();
                if (data && data.success) {
                    balance = parseFloat(data.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            } catch (e) { console.error("Balance fetch delay"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
            
            // ওরিজিনাল ডিফল্ট স্টার্ট আপ ৩×৩ ফ্রুট গ্রিড ভিউ লক ভাই ভাই
            const defaultGrid = [
                ["CHERRY", "LEMON", "WATERMELON"],
                ["BAR", "ORANGE", "PLUM"],
                ["GRAPE", "BAR", "CHERRY"]
            ];
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    if (cell) {
                        cell.innerHTML = `<img src="./${defaultGrid[r][c]}.png" alt="slot" class="symbolImg">`;
                    }
                }
            }
        };

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 1) {
                if (currentBet <= 10) currentBet -= 1;
                else if (currentBet <= 100) currentBet -= 10;
                else if (currentBet <= 1000) currentBet -= 100;
                else currentBet -= 500;
            }
            if (action === 'plus' && currentBet < 20000) {
                if (currentBet < 10) currentBet += 1;
                else if (currentBet < 100) currentBet += 10;
                else if (currentBet < 1000) currentBet += 100;
                else currentBet += 500;
            }
            if (currentBet < 1) currentBet = 1;
            if (currentBet > 20000) currentBet = 20000;
            
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            try { slotSounds.click.play(); } catch(e){}
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("mute-btn").innerText = isMuted ? "🔇" : "🔊";
            document.getElementById("mute-btn").classList.toggle("muted-active", isMuted);
            slotSounds.click.muted = isMuted;
            slotSounds.spin.muted = isMuted;
            slotSounds.win.muted = isMuted;
            slotSounds.wheel.muted = isMuted;
        }

        function toggleAuto() {
            isAuto = !isAuto;
            document.getElementById("auto-btn").classList.toggle("active", isAuto);
            if (isAuto && !isSpinning) handleSlotSpin();
            try { slotSounds.click.play(); } catch(e){}
        }

        function stopSlotState() {
            isSpinning = false;
            document.getElementById("spin-btn").disabled = false;
            if (!isAuto && autoInterval) clearTimeout(autoInterval);
        }

        // 🎯 [৪টি ওরিজিনাল প্রিমিয়াম ক্যাসিনো সাউন্ড ও বাফার গেটওয়ে লক ভাই ভাই]
        const slotSounds = {
            click: new Audio('click2.mp3'),
            spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3'),
            wheel: new Audio('wheel1.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());
    </script>
</body>
</html>

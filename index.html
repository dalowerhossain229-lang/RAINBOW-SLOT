<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAINBOW MEGAWAYS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <!-- 🎰 ক্যাসিনো হেডার প্যানেল (ডার্বি জ্যাম মুক্ত পিউর রেনবো স্লট ডাইনামিক ব্যালেন্স বর্ম ভাই ভাই) -->
    <div class="header">
        <div class="brand">
            <div class="name">RAINBOW MEGAWAYS</div>
            <div class="game">3x3 ALL-WAYS JACKPOT</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>


    <!-- 🎰 ৩×৩ মাল্টি-পেলাইন ও এনিহোয়ার ৩-ম্যাচ স্ক্যাটার গ্রিড জানালা ভাই ভাই -->
    <div class="slot-machine-zone">
        <div class="slot-window-frame">
            <div class="reel-container">
                <!-- ১ম সারি -->
                <div class="slot-cell" id="cell-0-0"></div>
                <div class="slot-cell" id="cell-0-1"></div>
                <div class="slot-cell" id="cell-0-2"></div>
                <!-- ২য় সারি -->
                <div class="slot-cell" id="cell-1-0"></div>
                <div class="slot-cell" id="cell-1-1"></div>
                <div class="slot-cell" id="cell-1-2"></div>
                <!-- ৩য় সারি -->
                <div class="slot-cell" id="cell-2-0"></div>
                <div class="slot-cell" id="cell-2-1"></div>
                <div class="slot-cell" id="cell-2-2"></div>
            </div>
            <!-- মাঝখানের সুদৃশ্য গোল্ডেন উইন টার্গেট লাইন -->
            <div class="win-target-line"></div>
        </div>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ স্কোরিং মেসেজ বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">SPIN বোতাম চেপে লাকি রেনবো গ্রিড ঘুরান ভাই ভাই!</span>
    </div>

    <!-- 🎛️ কন্ট্রোল প্যানেল এরিয়া (৳১-৳২০০০০ প্লাস-মাইনাস ও SPIN বোতাম পাশাপাশি লক ভাই) -->
    <div class="footer-controls">
        <div class="play-section">
            <div class="bet-selector">
                <button class="bet-btn-nav" onclick="adjustBet('minus')">−</button>
                <div style="text-align: center; width: 60px;">
                    <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                    <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
                </div>
                <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>
            </div>

            <button class="play-btn" id="spin-btn" onclick="handleSlotSpin()">SPIN</button>

            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🔄</button>
            </div>
        </div>
    </div>

    <!-- 🔌 [উইনগো কালার ট্রেড সিঙ্ক - ইউনিভার্সাল সকেট ইঞ্জিন লাইব্রেরি ভাই] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        
        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50; 
        let isSpinning = false; 
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        // 🚀 [ডাইস-৩ডি স্ট্যান্ডার্ড]: লোকাল রাউটিং গেটওয়ে সিঙ্ক মেকানিজম ভাই ভাই
        async function handleSlotSpin() {
            if (isSpinning) return;

            try {
                slotSounds.click.play();
                slotSounds.spin.play();
            } catch (e) { console.log("Autoplay click trigger waiting"); }

            document.getElementById("win-status-box").className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🎰 রেনবো রিল শোঁ শোঁ করে ঘুরছে...";

            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;

            const cells = document.querySelectorAll(".slot-cell");
            cells.forEach(c => {
                c.classList.remove("win-highlight", "dim-effect");
                c.classList.add(isAuto ? "turbo-mode" : "scrolling");
            });

            try {
                // ডাইস-৩ডি এর মতো সরাসরি ডাইনামিক SERVER_URL হিট লক ভাই ভাই!
                const response = await fetch(`${SERVER_URL}/api/rainbow-spin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: parseFloat(currentBet),
                        wallet: urlWallet
                    })
                });

                const data = await response.json();

                if (data && data.success === true) {
                    balance = parseFloat(data.balance);
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");

                    setTimeout(() => {
                        stopAllReelsWithMatrix(data.matrix, data.winAmount, data.status, data.winningLines);
                    }, isAuto ? 400 : 1200);

                } else {
                    cells.forEach(c => c.classList.remove("scrolling", "turbo-mode"));
                    alert(data.message || "❌ Insufficient Balance! Please Recharge.");
                    stopSlotState();
                }
            } catch (err) {
                cells.forEach(c => c.classList.remove("scrolling", "turbo-mode"));
                alert("⚠️ সেশন আউট! আবার SPIN বোতাম চাপুন ভাই ভাই।");
                stopSlotState();
            }
        }

        // 🚀 ৯টি নিয়ন ঘরে ৩×৩ আকারে ওরিজিনাল ইমেজ ইনজেকশন এবং উইন হাইলাইট বর্ম ভাই ভাই!
        function stopAllReelsWithMatrix(matrix, winAmount, status, winningLines) {
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const cell = document.getElementById(`cell-${row}-${col}`);
                    if (cell) {
                        cell.classList.remove("scrolling", "turbo-mode", "win-highlight", "dim-effect");
                        
                        // কেস-সেন্সিটিভ বাগ ফিক্স ফিল্টার বর্ম ভাই ভাই
                        const rawSymbol = matrix[row][col];
                        const symbolImg = rawSymbol ? rawSymbol.toLowerCase() : "cherry";
                        
                        cell.innerHTML = `<img src="./${symbolImg}.png" alt="${symbolImg}" class="symbolImg">`;
                    }
                }
            }

            if (status === "win" && winningLines && winningLines.length > 0) {
                const cells = document.querySelectorAll(".slot-cell");
                cells.forEach(c => c.classList.add("dim-effect")); 

                winningLines.forEach(lineId => {
                    let coordinates = [];
                    if (lineId === "LINE_1") coordinates = ["0-0", "0-1", "0-2"]; 
                    if (lineId === "LINE_2") coordinates = ["1-0", "1-1", "1-2"]; 
                    if (lineId === "LINE_3") coordinates = ["2-0", "2-1", "2-2"]; 
                    if (lineId === "LINE_4") coordinates = ["0-0", "1-1", "2-2"]; 
                    if (lineId === "LINE_5") coordinates = ["0-2", "1-1", "2-0"]; 
                    
                    if (Array.isArray(lineId)) {
                        // এনিহোয়ার ৩-ম্যাচ স্ক্যাটার কোঅর্ডিনেট সিঙ্ক ম্যাপিং
                        coordinates = lineId.map(pos => `${pos[0]}-${pos[1]}`);
                    } 

                    coordinates.forEach(pos => {
                        const cell = document.getElementById(`cell-${pos}`);
                        if (cell) {
                            cell.classList.remove("dim-effect");
                            cell.classList.add("win-highlight");
                        }
                    });
                });
            }

            showFinalReward(status, winAmount);
        }

        // 🚀 [বাটন ও প্লাস-মাইনাস লক জ্যাম ১০০০০০% চিরতরে আনলক বর্ম ভাই ভাই]
        function showFinalReward(status, winAmount) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");

            if (status === "win") {
                try { slotSounds.win.play(); } catch(e){}
                msgBox.className = "win-status-container win-glow-bar";
                textMsg.innerText = `🏆 মেগা উইন!! মাল্টি-পেলাইন মিলে সরাসরি: ৳${winAmount} প্লাস`;
            } else {
                try { slotSounds.wheel.play(); } catch(e){}
                msgBox.className = "win-status-container lose-glow-bar";
                textMsg.innerText = "❌ ওহ! এই রাউন্ডে কোনো পেলাইন মেলেনি। আবার ট্রাই করুন ভাই ভাই!";
            }

            document.getElementById("user-balance").innerText = balance.toFixed(2);
            
            // বাটন আনলক করার প্রধান চাবি ফায়ার লক ভাই ভাই
            stopSlotState();

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleSlotSpin();
                }, 2500);
            }
        }

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    fetchLiveBalance();
                }
            });
        }

        
        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/rainbow-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const data = await response.json();
                if (data && data.success) {
                    balance = parseFloat(data.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            } catch (e) { console.error("Balance fetch delay"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
            
            // 🎰 ওরিজিনাল ডিফল্ট স্টার্ট আপ ৩×৩ ফ্রুট গ্রিড ভিউ লক ভাই ভাই
            const defaultGrid = [
                ["CHERRY", "LEMON", "WATERMELON"],
                ["BAR", "ORANGE", "PLUM"],
                ["GRAPE", "BAR", "CHERRY"]
            ];
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    if (cell) {
                        cell.innerHTML = `<img src="./${defaultGrid[r][c].toLowerCase()}.png" alt="slot" class="symbolImg">`;
                    }
                }
            }
        };

              function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 1) {
                if (currentBet <= 10) currentBet -= 1;
                else if (currentBet <= 100) currentBet -= 10;
                else if (currentBet <= 1000) currentBet -= 100;
                else currentBet -= 500;
            }
            if (action === 'plus' && currentBet < 20000) {
                if (currentBet < 10) currentBet += 1;
                else if (currentBet < 100) currentBet += 10;
                else if (currentBet < 1000) currentBet += 100;
                else currentBet += 500;
            }
            if (currentBet < 1) currentBet = 1;
            if (currentBet > 20000) currentBet = 20000;
            
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            try { slotSounds.click.play(); } catch(e){}
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("mute-btn").innerText = isMuted ? "🔇" : "🔊";
            document.getElementById("mute-btn").classList.toggle("muted-active", isMuted);
            slotSounds.click.muted = isMuted;
            slotSounds.spin.muted = isMuted;
            slotSounds.win.muted = isMuted;
            slotSounds.wheel.muted = isMuted;
        }

        function toggleAuto() {
            isAuto = !isAuto;
            document.getElementById("auto-btn").classList.toggle("active", isAuto);
            if (isAuto && !isSpinning) handleSlotSpin();
            try { slotSounds.click.play(); } catch(e){}
        }

        // 🚀 [বাটন আনলক মেগা বর্ম]: স্পিন শেষ হওয়ার পর প্রধান বোতাম ও অটো বোতাম ১০০% রিলিজ লক ভাই ভাই!
        function stopSlotState() {
            isSpinning = false;
            document.getElementById("spin-btn").disabled = false; // প্রধান বাটন সচল
            
            // অটো স্পিন একটিভ না থাকলে অটো বোতামের রেড এলার্ট রিমুভ ভাই ভাই
            if (!isAuto) {
                document.getElementById("auto-btn").classList.remove("active");
                if (autoInterval) clearTimeout(autoInterval);
            }
        }

        // 🎯 [৪টি ওরিজিনাল প্রিমিয়াম ক্যাসিনো সাউন্ড ও বাফার গেটওয়ে লক ভাই ভাই]
        const slotSounds = {
            click: new Audio('click2.mp3'),
            spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3'),
            wheel: new Audio('wheel1.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROYAL RAINBOW SLOT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার প্যানেল -->
    <div class="header">
        <div class="brand">
            <div class="name">RAINBOW SLOT</div>
            <div class="game">3-REEL MEGA JACKPOT</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🎰 [৩-রিল ক্যানভাস স্লট মেশিন জোন] (ছবি ছাড়া পিউর ভেক্টর ভাই ভাই) -->
    <div class="slot-machine-zone">
        <div class="slot-window-frame">
            <canvas id="slot-canvas" width="360" height="220"></canvas>
        </div>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ স্কোরিং মেসেজ বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">আপনার বাজি ধরুন এবং SPIN বোতাম চাপুন ভাই!</span>
    </div>

    <!-- 🎛️ কন্ট্রোল প্যানেল এরিয়া (৳১-৳২০০০ প্লাস-মাইনাস ও SPIN বোতাম পাশাপাশি লক ভাই) -->
    <div class="footer-controls">
        <div class="play-section">
            <div class="bet-selector">
                <button class="bet-btn-nav" onclick="adjustBet('minus')">−</button>
                <div style="text-align: center; width: 60px;">
                    <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                    <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
                </div>
                <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>
            </div>

            <button class="play-btn" id="spin-btn" onclick="handleSlotSpin()">SPIN</button>

            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🔄</button>
            </div>
        </div>
    </div>

    <!-- 🔌 [উইনগো কালার ট্রেড সিঙ্ক - ইউনিভার্সাল সকেট ইঞ্জিন লাইব্রেরি ভাই] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        
        const SERVER_URL = window.location.origin;

        const canvas = document.getElementById("slot-canvas");
        const ctx = canvas.getContext("2d");

        let balance = 0.00;
        let currentBet = 50; 
        let isSpinning = false; 
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

                // 🚀 [বিচ্ছিরি টেক্সট জ্যাম সম্পূর্ণ ফিক্সড বর্ম]: কাঁচা টেক্সটের বদলে পিউর লাক্সারি নিওন ফ্রুট ইমোজি ম্যাপিং ভাই ভাই!
        const iconSymbols = {
            "CHERRY": "🍒",
            "LEMON": "🍋",
            "ORANGE": "🍊",
            "PLUM": "🍇", 
            "GRAPE": "🍇",
            "WATERMELON": "🍉",
            "BAR": "🔔"
        };

        // 🎰 ওরিজিনাল ৩-রিলের লাইভ স্ক্রলিং পজিশন ও স্পিড কন্ট্রোলার চাবি ভাই ভাই
        let reels = [
            { symbols: ["🍒", "🍉", "🍋", "🍇"], y: 0, speed: 0, targetY: 0 },
            { symbols: ["🍋", "🍇", "🍉", "🍒"], y: 0, speed: 0, targetY: 0 },
            { symbols: ["🍉", "🍒", "🍇", "🍋"], y: 0, speed: 0, targetY: 0 }
        ];

        const reelwidth = 100;
        const reelHeight = 220;
        const itemHeight = 70;
        const startX = (canvas.width - (3 * reelwidth)) / 2;

        function renderSlotMachine() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ৩টি রিল ব্যাকগ্রাউন্ড গ্রিড পারফেক্ট ড্রয়িং ভাই ভাই
            for (let i = 0; i < 3; i++) {
                const rx = startX + (i * reelwidth);

                // রিল বডি বর্ম
                ctx.fillStyle = "#0f1524";
                ctx.fillRect(rx, 0, reelwidth - 6, reelHeight);
                ctx.strokeStyle = "#1a233d";
                ctx.lineWidth = 2;
                ctx.strokeRect(rx, 0, reelwidth - 6, reelHeight);

                // আইকনগুলো স্ক্রলিং মোশনে লুপ প্রিন্টিং ভাই ভাই
                ctx.save();
                ctx.beginPath();
                ctx.rect(rx, 0, reelwidth - 6, reelHeight);
                ctx.clip();

                const currentY = reels[i].y;
                const totalItems = reels[i].symbols.length;

                for (let j = -2; j < totalItems + 2; j++) {
                    const index = (j + totalItems * 10) % totalItems;
                    const sym = reels[i].symbols[index];
                    const py = (j * itemHeight) + (currentY % itemHeight);

                    ctx.fillStyle = "#ffffff";
                    // 🚀 [মেইন ফিক্স]: ওরিজিনাল ফন্ট সাইজ ৪০ পিক্সেল ও পিউর ফ্রুট ইমোজি সিঙ্ক লক ভাই ভাই!
                    ctx.font = "40px Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";

                    // আইকন গ্লো বুস্টার শ্যাডো ট্রিক্স ভাই ভাই
                    ctx.shadowColor = "#f1c40f";
                    ctx.shadowBlur = isSpinning ? 8 : 0;
                    
                    // সার্ভার বা কাস্টম থেকে আসা কোড টেক্সটকে ইমোজিতে রূপান্তর ক্যাচ ভাই ভাই
                    const finalEmoji = iconSymbols[sym] || sym;
                    ctx.fillText(finalEmoji, rx + (reelwidth - 6) / 2, py + itemHeight / 2);
                    ctx.shadowBlur = 0;
                }
                ctx.restore();
            }

            // মাঝখানের গোল্ডেন উইন টার্গেট লাইন বর্ম ভাই ভাই
            ctx.strokeStyle = "rgba(241, 196, 15, 0.75)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(startX, canvas.height / 2);
            ctx.lineTo(startX + (3 * reelwidth) - 6, canvas.height / 2);
            ctx.stroke();
        }

        function updateSlotAnimation() {
            let stillSpinning = false;

            for (let i = 0; i < 3; i++) {
                if (reels[i].speed > 0) {
                    reels[i].y += reels[i].speed;
                    reels[i].speed *= 0.96; // 🚀 ঘূর্ণন স্পিড ফিজিক্স স্মুথ ব্রেক মেকানিজম ভাই ভাই
                    stillSpinning = true;

                    if (reels[i].speed < 0.2) {
                        reels[i].speed = 0;
                        reels[i].y = reels[i].targetY;
                        playAudio('click1'); // রিল খটখট করে লক হওয়ার ব্রেক সাউন্ড
                    }
                }
            }

            renderSlotMachine();

            if (stillSpinning) {
                requestAnimationFrame(updateSlotAnimation);
            } else {
                isSpinning = false;
                if (!isAuto) document.getElementById("spin-btn").disabled = false;
            }
        }

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    fetchLiveBalance();
                }
            });
        }


            

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/rainbowslot-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const data = await response.json();
                if (data && data.success) {
                    balance = parseFloat(data.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            } catch (e) { console.error("Balance lag"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
            renderSlotMachine();
        };

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 1) {
                if (currentBet <= 10) currentBet -= 1;
                else if (currentBet <= 100) currentBet -= 10;
                else currentBet -= 50;
            }
            if (action === 'plus' && currentBet < 2000) {
                if (currentBet < 10) currentBet += 1;
                else if (currentBet < 100) currentBet += 10;
                else currentBet += 50;
            }
            if (currentBet < 1) currentBet = 1;
            if (currentBet > 2000) currentBet = 2000;
            
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("mute-btn").innerText = isMuted ? "🔇" : "🔊";
            document.getElementById("mute-btn").classList.toggle("muted-active", isMuted);
        }

                function toggleAuto() {
            isAuto = !isAuto;
            document.getElementById("auto-btn").classList.toggle("active", isAuto);
            if (isAuto && !isSpinning) handleSlotSpin();
            playAudio('click');
        }
        
        
             // 🚀 [রিল স্টপিং এবং কম্বিনেশন অমিল সম্পূর্ণ ফিক্সড কিংস বর্ম ভাই ভাই]
        async function handleSlotSpin() {
            if (isSpinning) return;

            document.getElementById("win-status-box").className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🎰 রেনবো রিল শোঁ শোঁ করে ঘুরছে...";

            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;
            
            playAudio('click');
            playAudio('spin'); 

            // স্পিন শুরুর বুস্টিং স্পিড পুশ ভাই ভাই
            reels[0].speed = 18;
            reels[1].speed = 22;
            reels[2].speed = 26;
            
            requestAnimationFrame(updateSlotAnimation);

            try {
                const response = await fetch(`${SERVER_URL}/api/rainbow-spin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: parseFloat(currentBet),
                        wallet: urlWallet
                    })
                });

                const data = await response.json();

                if (data && data.success === true) {
                    balance = parseFloat(data.balance);
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");

                    // 🎯 [ওরিজিনাল কম্বিনেশন সিঙ্ক চাবি]: সার্ভার থেকে আসা ১ শতভাগ রিয়াল ডাটা আইকন সরাসরি রিল মেমরিতে পুশ লক ভাই ভাই!
                    setTimeout(() => { 
                        reels[0].symbols = [data.reel1, "🍉", "🍒", "🍋"]; 
                        reels[0].speed = 0; 
                        reels[0].y = 0;
                        playAudio('click1'); 
                    }, 800);
                    
                    setTimeout(() => { 
                        reels[1].symbols = [data.reel2, "🍋", "GRAPE", "BAR"]; 
                        reels[1].speed = 0; 
                        reels[1].y = 0;
                        playAudio('click1'); 
                    }, 1200);
                    
                    setTimeout(() => {
                        reels[2].symbols = [data.reel3, "🔔", "BAR", "CHERRY"]; 
                        reels[2].speed = 0; 
                        reels[2].y = 0;
                        playAudio('click1'); 
                        
                        // ৩টি কলাম ফিক্সড লক হওয়ার পর ফাইনাল পুরষ্কার ডিক্লেয়ার হবে ভাই ভাই
                        setTimeout(() => {
                            showFinalReward(data.status, data.winAmount, data.reel1);
                        }, 400);
                    }, 1600);

                } else {
                    reels.forEach(r => r.speed = 0);
                    alert(data.message || "❌ Insufficient Balance! Please Recharge.");
                    stopSlotState();
                }
            } catch (err) {
                reels.forEach(r => r.speed = 0);
                alert("⚠️ সেশন আউট! আবার SPIN বোতাম চাপুন ভাই ভাই।");
                stopSlotState();
            }
        }
   

        
        function showFinalReward(status, winAmount, combination) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");

            if (status === "win") {
                if (winAmount >= (currentBet * 5)) {
                    playAudio('bigwin'); // ৫ গুণের বেশি প্রফিট হলে মেগা bigwin1.mp3 ব্লাস্ট ভাই ভাই!
                } else {
                    playAudio('win'); // সাধারণ উইন হলে win2.mp3 চাবি
                }
                msgBox.className = "win-status-container win-glow-bar";
                textMsg.innerText = `🏆 মেগা উইন!! কম্বিনেশন মিলেছে: [${combination}] = ৳${winAmount}`;
            } else {
                playAudio('wheel'); // লস ব্যাকআপ wheel1.mp3 সাউন্ড লক ভাই ভাই
                msgBox.className = "win-status-container lose-glow-bar";
                textMsg.innerText = "❌ ওহ! এই রাউন্ডে রিল মেলেনি। আবার ট্রাই করুন ভাই ভাই!";
            }

            document.getElementById("user-balance").innerText = balance.toFixed(2);
            stopSlotState();

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleSlotSpin();
                }, 2000);
            }
        }

        function stopSlotState() {
            isSpinning = false;
            document.getElementById("spin-btn").disabled = false;
            if (!isAuto && autoInterval) clearTimeout(autoInterval);
        }

        // 🎯 [৪টি ওরিজিনাল প্রিমিয়াম ক্যাসিনো সাউন্ড ও বাফার গেটওয়ে লক ভাই ভাই]
        const slotSounds = {
            click: new Audio('click2.mp3'),
            spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3'),
            bigwin: new Audio('bigwin1.mp3'),
            wheel: new Audio('wheel1.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) { 
            if (isMuted) return; 
            try { 
                slotSounds[type].currentTime = 0; 
                slotSounds[type].play(); 
            } catch(e){} 
        }
    </script>
</body>
</html>
